name: Deploy to GitHub Pages

# push 到 main 即自动：装依赖 → 类型检查 → 单测 → 静态导出 → 发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Unit tests
        run: node tests/build.mjs && node --test tests/plan.test.mjs tests/nutrition.test.mjs

      # 静态导出：构建期间临时移开 src/app/api，产出 out/ 后自动还原
      - name: Static export
        run: node scripts/build-static.mjs --base=/fit-loop

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
